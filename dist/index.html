<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="把抽象知识变成可操作的实验。计算机408数据结构、组成原理、操作系统与网络交互可视化。">
  <title>408 实验室 · 让知识运行起来</title>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="visual.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <a class="brand" href="#quick"><span class="brand-icon">4<span>08</span></span><span>408 实验室<small>COMPUTER SCIENCE LAB</small></span></a>
  <div class="nav-caption">知识地图 <span id="total-count">12 个实验</span></div>
  <label class="search"><span>⌕</span><input id="search" placeholder="搜索算法、知识点…" aria-label="搜索知识点"><kbd>/</kbd></label>
  <nav id="nav" aria-label="知识点导航"></nav>
  <div class="side-bottom"><div class="progress-title"><span>我的学习足迹</span><b id="progress-text">0 / 12</b></div><div class="progress-track"><i id="progress-fill"></i></div><p>运行实验，让理解再进一步。</p><span class="local-dot"></span> 学习记录保存在本机</div>
</aside>
<div class="workspace">
  <header class="topbar"><div><button id="menu-toggle" class="icon-button mobile-only" aria-label="切换导航">☰</button><span>知识地图</span><span class="slash">/</span><span id="breadcrumb"></span></div><div class="top-meta"><span class="status-dot"></span> 交互式学习空间 <span class="version">MOTION EDITION</span></div></header>
  <main>
    <div class="page-heading"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="heading-actions"><button id="mark" class="secondary">☆ 标记已掌握</button><button id="motion-toggle" class="motion-toggle" aria-pressed="true">✦ 动效开启</button></div><div class="orbit-art" aria-hidden="true"><span class="orbit"><i></i></span><span class="orbit"><i></i></span><span class="orbit"><i></i></span><span class="orbit-core">⌘</span></div></div>
    <div class="facts" id="facts"></div>
    <section class="experiment">
      <div class="section-top"><div><span class="section-icon">⌘</span><h2>交互实验台</h2><span class="tag">LIVE DEMO</span></div><button id="random" class="text-button">↻ 换一组数据</button></div>
      <form id="config" class="config"></form><p id="input-error" class="input-error" role="alert"></p>
      <div class="lab-layout"><div class="lab-main"><div class="canvas-top"><span id="scene-label"></span><div class="legend"><span><i class="legend-normal"></i>待处理</span><span><i class="legend-active"></i>当前操作</span><span><i class="legend-done"></i>已完成</span></div></div><span class="stage-counter" id="stage-step" aria-hidden="true">01</span><div id="visual" class="visual"></div><span class="stage-watermark" aria-hidden="true">408 / SIMULATION ENGINE</span><div class="scene-progress-track" aria-hidden="true"><i id="scene-progress"></i></div><div class="scene-caption" id="scene-caption"></div></div><aside class="step-aside"><div class="aside-label"><span class="pulse"></span> 当前步骤 <span id="step-counter"></span></div><h3 id="step-title"></h3><p id="step-description" aria-live="polite"></p><div id="variables" class="variables"></div><div class="tip"><span>↗ 思考一下</span><p id="thinking"></p></div></aside></div>
      <div class="transport"><div class="transport-buttons"><button id="reset" class="icon-button" title="回到起点" aria-label="回到起点">↺</button><button id="prev" class="icon-button" title="上一步（←）" aria-label="上一步">◀</button><button id="play" class="primary">▶ 自动演示</button><button id="next" class="icon-button" title="下一步（→）" aria-label="下一步">▶</button></div><label class="timeline"><input id="timeline" type="range" min="0" value="0" aria-label="实验进度"><span id="timeline-text">01 / 01</span></label><label class="speed">速度 <select id="speed" aria-label="播放速度"><option value="1400">0.5×</option><option value="800" selected>1×</option><option value="350">2×</option></select></label></div>
    </section>
    <div class="lower-grid"><section class="content-card"><div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="principle">原理与考点</button><button role="tab" aria-selected="false" data-tab="code">代码实现</button><button role="tab" aria-selected="false" data-tab="quiz">小试牛刀 <span>1</span></button></div><div id="principle" class="tab-panel"></div><div id="code" class="tab-panel" hidden><div class="code-toolbar"><span id="code-language"></span><button id="copy" class="text-button">复制代码</button></div><pre><code id="code-text"></code></pre><p class="code-hint">高亮行跟随动画步骤。可返回任一步，观察状态与代码的对应关系。</p></div><div id="quiz" class="tab-panel" hidden></div></section><aside class="connection-card"><span class="eyebrow">CONNECT THE DOTS</span><h3>把知识连起来</h3><p id="connection-intro"></p><div id="connections"></div><div class="keyboard-hint"><kbd>Space</kbd> 播放 / 暂停 <br><kbd>←</kbd> <kbd>→</kbd> 单步观察</div></aside></div>
    <footer><span><b>408</b> 实验室 <span class="footer-divider">/</span> 让知识运行起来。</span><span>探索 · 操作 · 理解</span></footer>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="lessons.js"></script><script src="engine.js"></script><script src="motion.js"></script><script src="app.js"></script>
</body></html>
